    <text x="48" y="164" font-size="13.5" font-weight="700" fill="#1f2328">Top Stories</text>
    <text x="56" y="190" font-size="13" fill="#0969da" font-weight="600">•  MHRA approves oral GLP-1 for weight loss<tspan fill="#59636e" font-weight="400"> — MHRA</tspan></text>
