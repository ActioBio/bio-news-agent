    <text x="68" y="227" font-size="12.5" fill="#59636e">formulations.</text>
    <text x="56" y="253" font-size="13" fill="#0969da" font-weight="600">•  Amgen adds Duke analysis for Tavneos<tspan fill="#59636e" font-weight="400"> — BioSpace Business</tspan></text>
    <text x="68" y="273" font-size="12.5" fill="#59636e">Independent review may shape whether Tavneos can withstand FDA pressure for</text>
    <text x="68" y="290" font-size="12.5" fill="#59636e">withdrawal.</text>

    <text x="48" y="328" font-size="13.5" font-weight="700" fill="#1f2328">Regulatory &amp; FDA</text>
    <text x="56" y="354" font-size="13" fill="#0969da">•  MHRA clears lower-dose nasal adrenaline<tspan fill="#59636e"> — MHRA</tspan></text>
    <text x="56" y="378" font-size="13" fill="#0969da">•  FDA flags Dabur plant GMP failures<tspan fill="#59636e"> — BioSpace Business</tspan></text>

